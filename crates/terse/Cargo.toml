[package]
name = "terse"
version = "0.3.2"
edition = "2021"
description = "Token compressor for LLM conversation history"
repository = "https://github.com/fwdai/terse"
license = "MIT"

[lib]
name = "terse"
path = "src/lib.rs"

[[bin]]
name = "terse"
path = "src/bin/terse/main.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[[bench]]
name = "compress"
harness = false

[dependencies]
self_update = { version = "0.41", default-features = false, features = ["archive-tar", "compression-flate2", "rustls"] }
regex = "1"
fancy-regex = "0.13"
tiktoken-rs = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
once_cell = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
bytes = "1"
